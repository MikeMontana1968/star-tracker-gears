; Star tracker firmware (FIRMWARE.md s8, D9).
;   pio run -e esp32-oled -t upload        the tracker: night FSM + serial console
;   pio run -e esp32-bench -t upload       bench console (motion / hardware tests)
;   pio device monitor -e esp32-oled       serial console
;   pio test -e native                     host tests, no hardware
;
; The sketch folders beside this file (as5600_check, first_spin, ...) are
; arduino-cli bench tools, not part of this build.

[platformio]
default_envs = esp32-oled

[esp32_common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800            ; CH340 -- drop to 115200 if uploads fail
board_build.filesystem = littlefs
build_flags   = -DCORE_DEBUG_LEVEL=2
test_ignore   = *
lib_deps =
  adafruit/Adafruit SSD1306 @ ^2.5.9
  adafruit/Adafruit GFX Library @ ^1.11.9
  bblanchon/ArduinoJson @ ^7.1.0

[env:esp32-oled]
extends = esp32_common
extra_scripts = pre:tools/embed_ui.py      ; web/index.html -> include/ui_gz.h
build_src_filter = +<*> -<bench_main.cpp>

[env:esp32-bench]
extends = esp32_common
build_flags   = -DCORE_DEBUG_LEVEL=3
build_src_filter = +<bench_main.cpp>

[env:native]
platform       = native
test_framework = unity
build_flags    = -DSIM_BUILD -std=gnu++17 -DUNITY_INCLUDE_DOUBLE
lib_deps       = bblanchon/ArduinoJson @ ^7.1.0
build_src_filter = -<*>
